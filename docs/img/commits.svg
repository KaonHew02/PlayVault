<text x="16" y="28" font-size="13.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">44 commits on 8 working days — bar length is commits that day</tspan></text><text x="16" y="79" font-size="14" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">7 Sep</tspan></text><rect x="78" y="60" width="66" height="26" rx="5" fill="#F6B32B"  /><text x="152" y="79" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="152" dy="0">3</tspan></text><text x="318" y="70" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="318" dy="0">Hub shell and eleven games — all three engine contracts proven</tspan></text><line x1="16" y1="95" x2="804" y2="95" stroke="#EEF1F5"/><text x="16" y="125" font-size="14" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">8 Sep</tspan></text><rect x="78" y="106" width="132" height="26" rx="5" fill="#F6B32B"  /><text x="218" y="125" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="218" dy="0">6</tspan></text><text x="318" y="116" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="318" dy="0">Interface sizing · play with friends · Spider Solitaire · Worm Arena</tspan></text><line x1="16" y1="141" x2="804" y2="141" stroke="#EEF1F5"/><rect x="16" y="146" width="788" height="22" rx="4" fill="none" stroke="#C9D1DC" stroke-width="1.5" stroke-dasharray="4 4"/><text x="410" y="162" font-size="12.5" font-weight="400" fill="#566579" text-anchor="middle" font-style="italic" ><tspan x="410" dy="0">9 – 21 Sep · no commits</tspan></text><text x="16" y="201" font-size="14" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">22 Sep</tspan></text><rect x="78" y="182" width="198" height="26" rx="5" fill="#F6B32B"  /><text x="284" y="201" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="284" dy="0">9</tspan></text><text x="318"