<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 574" width="820" height="574" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566579"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
</defs>
<rect width="820" height="574" fill="#FFFFFF"/>
<rect x="16" y="16" width="584" height="548" rx="8" fill="#FAFBFC" stroke="#C9D1DC" stroke-width="1.5" /><text x="34" y="42" font-size="12.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.6"><tspan x="34" dy="0">THE PAGE  ·  ONE STATIC ORIGIN ON GITHUB PAGES</tspan></text><rect x="36" y="56" width="544" height="52" rx="8" fill="#171D26"  /><text x="52" y="79" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="52" dy="0">guard.js — the lock</tspan></text><text x="52" y="98" font-size="13" font-weight="400" fill="#C9D1DC" text-anchor="start"  ><tspan x="52" dy="0">first in the head · its own file, never bundled · off on localhost</tspan></text><line x1="308" y1="108" x2="308" y2="126" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="36" y="126" width="544" height="338" rx="8" fill="#FFF6DD" stroke="#F6B32B" stroke-width="2" /><text x="52" y="151" font-size="15" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="52" dy="0">playvault.min.js — 124 files, 1.25 MB (about 400 KB gzipped)</tspan></text><rect x="48" y="166" width="520" height="50" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="48" y="166" width="96" height="50" rx="8" fill="#2A3441"  /><rect x="128" y="166" width="16" height="50" rx="0" fill="#2A3441"  /><text x="96" y="196" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="96" dy="0">Shell</tspan></text><text x="156" y="187" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="156" dy="0">js/app.js — lobby, play, stats, settings, friends,</tspan><tspan x="156" dy="18">and the hash route. It names no game.</tspan></text><rect x="48" y="224" width="520" height="50" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="48" y="224" width="96" height="50" rx="8" fill="#A85D00"  /><rect x="128" y="224" width="16" height="50" rx="0" fill="#A85D00"  /><text x="96" y="254" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="96" dy="0">Games</tspan></text><text x="156" y="245" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="156" dy="0">16 folders, js/games/&lt;code&gt;/ — each one registers itself:</tspan><tspan x="156" dy="18">PV.Registry.add({ family, options, start })</tspan></text><rect x="48" y="282" width="520" height="50" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="48" y="282" width="96" height="50" rx="8" fill="#2A3441"  /><rect x="128" y="282" width="16" height="50" rx="0" fill="#2A3441"  /><text x="96" y="312" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="96" dy="0">Harnesses</tspan></text><text x="156" y="303" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="156" dy="0">boardhost · loophost · boardnet · race</tspan><tspan x="156" dy="18">canvas, resize, full screen, pause, thumb pad, end card</tspan></text><rect x="48" y="340" width="520" height="50" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="48" y="340" width="96" height="50" rx="8" fill="#2A3441"  /><rect x="128" y="340" width="16" height="50" rx="0" fill="#2A3441"  /><text x="96" y="370" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="96" dy="0">Contracts</tspan></text><text x="156" y="361" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="156" dy="0">board.js · puzzle.js · loop.js — three engine contracts.</tspan><tspan x="156" dy="18">Engines never touch the DOM, the profile or Math.random()</tspan></text><rect x="48" y="398" width="520" height="50" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="48" y="398" width="96" height="50" rx="8" fill="#2A3441"  /><rect x="128" y="398" width="16" height="50" rx="0" fill="#2A3441"  /><text x="96" y="428" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="96" dy="0">Core</tspan></text><text x="156" y="419" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="156" dy="0">util · safe · rng · store · profile · i18n · icons</tspan><tspan x="156" dy="18">registry · cards · net · room · drive</tspan></text><line x1="308" y1="464" x2="308" y2="480" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="36" y="480" width="544" height="66" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="52" y="504" font-size="15" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="52" dy="0">index.html</tspan></text><text x="52" y="525" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="52" dy="0">Content-Security-Policy · SRI hash on PeerJS · the script order</tspan></text><text x="52" y="540" font-size="12" font-weight="400" fill="#566579" text-anchor="start"  ><tspan x="52" dy="0">The deployed page loads three scripts: the lock, PeerJS, the bundle</tspan></text><rect x="636" y="90" width="172" height="94" rx="8" fill="#FFFFFF" stroke="#2A3441" stroke-width="2" /><rect x="636" y="90" width="172" height="28" rx="8" fill="#2A3441"  /><rect x="636" y="106" width="172" height="12" rx="0" fill="#2A3441"  /><text x="722" y="109" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="722" dy="0">This browser</tspan></text><text x="648" y="140" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="648" dy="0">localStorage, playvault.*</tspan><tspan x="648" dy="18">records sealed</tspan><tspan x="648" dy="18">11 backup stores</tspan></text><line x1="600" y1="137" x2="634" y2="137" stroke="#2A3441" stroke-width="1.6"  marker-end="url(#ah)"/><text x="617" y="131" font-size="11" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="617" dy="0"></tspan></text><rect x="636" y="236" width="172" height="112" rx="8" fill="#FFFFFF" stroke="#2F5E96" stroke-width="2" /><rect x="636" y="236" width="172" height="28" rx="8" fill="#2F5E96"  /><rect x="636" y="252" width="172" height="12" rx="0" fill="#2F5E96"  /><text x="722" y="255" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="722" dy="0">Google Drive</tspan></text><text x="648" y="286" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="648" dy="0">the player’s own</tspan><tspan x="648" dy="18">optional · off by default</tspan><tspan x="648" dy="18">playvault-data.json</tspan><tspan x="648" dy="18">scope: drive.file</tspan></text><line x1="600" y1="292" x2="634" y2="292" stroke="#2F5E96" stroke-width="1.6"  marker-end="url(#ah)"/><text x="617" y="286" font-size="11" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="617" dy="0"></tspan></text><rect x="636" y="396" width="172" height="94" rx="8" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2" /><rect x="636" y="396" width="172" height="28" rx="8" fill="#1F7A6A"  /><rect x="636" y="412" width="172" height="12" rx="0" fill="#1F7A6A"  /><text x="722" y="415" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle"  ><tspan x="722" dy="0">PeerJS broker</tspan></text><text x="648" y="446" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="648" dy="0">introductions only</tspan><tspan x="648" dy="18">then WebRTC, straight</tspan><tspan x="648" dy="18">between browsers</tspan></text><line x1="600" y1="443" x2="634" y2="443" stroke="#1F7A6A" stroke-width="1.6"  marker-end="url(#ah)"/><text x="617" y="437" font-size="11" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="617" dy="0"></tspan></text><rect x="636" y="516" width="172" height="38" rx="8" fill="none" stroke="#566579" stroke-width="1.5" stroke-dasharray="5 4"/><text x="722" y="540" font-size="13" font-weight="400" fill="#566579" text-anchor="middle"  ><tspan x="722" dy="0">a friend’s browser</tspan></text><line x1="722" y1="492" x2="722" y2="514" stroke="#566579" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
</svg>