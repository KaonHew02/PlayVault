<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 566" width="820" height="566" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566579"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
</defs>
<rect width="820" height="566" fill="#FFFFFF"/>
<rect x="16" y="16" width="252" height="466" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="16" width="252" height="54" rx="8" fill="#2F5E96"  /><rect x="16" y="50" width="252" height="20" rx="0" fill="#2F5E96"  /><text x="32" y="49" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="32" dy="0">Board</tspan></text><text x="252" y="49" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end"  ><tspan x="252" dy="0">4 games</tspan></text><text x="32" y="92" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="32" dy="0">CONTRACT</tspan></text><text x="32" y="110" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">board.js — two seats,</tspan><tspan x="32" dy="18">strict alternation</tspan></text><text x="32" y="160" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="32" dy="0">HARNESS</tspan></text><text x="32" y="178" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">boardhost.js</tspan></text><text x="32" y="210" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="32" dy="0">THE RULE</tspan></text><text x="32" y="228" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">legalMoves() is the only source</tspan><tspan x="32" dy="18">of legality; apply() is the</tspan><tspan x="32" dy="18">only way in</tspan></text><text x="32" y="296" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="32" dy="0">GAMES</tspan></text><text x="32" y="314" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">Gomoku · Reversi · Chess</tspan><tspan x="32" dy="18">Chinese Chess</tspan></text><text x="32" y="364" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="32" dy="0">WITH FRIENDS</tspan></text><text x="32" y="382" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">Host authority: two seats,</tspan><tspan x="32" dy="18">turn by turn (boardnet.js)</tspan></text><rect x="284" y="16" width="252" height="466" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="284" y="16" width="252" height="54" rx="8" fill="#1F7A6A"  /><rect x="284" y="50" width="252" height="20" rx="0" fill="#1F7A6A"  /><text x="300" y="49" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="300" dy="0">Puzzle</tspan></text><text x="520" y="49" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end"  ><tspan x="520" dy="0">3 games</tspan></text><text x="300" y="92" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="300" dy="0">CONTRACT</tspan></text><text x="300" y="110" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="300" dy="0">puzzle.js — one player,</tspan><tspan x="300" dy="18">a deal from a seed</tspan></text><text x="300" y="160" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="300" dy="0">HARNESS</tspan></text><text x="300" y="178" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="300" dy="0">none — each puzzle draws</tspan><tspan x="300" dy="18">its own bar</tspan></text><text x="300" y="228" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="300" dy="0">THE RULE</tspan></text><text x="300" y="246" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="300" dy="0">The deal is a pure function of</tspan><tspan x="300" dy="18">(seed, difficulty); every move</tspan><tspan x="300" dy="18">returns its own inverse</tspan></text><text x="300" y="314" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="300" dy="0">GAMES</tspan></text><text x="300" y="332" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="300" dy="0">Sudoku · Spider Solitaire</tspan><tspan x="300" dy="18">Mahjong Solitaire</tspan></text><text x="300" y="382" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="300" dy="0">WITH FRIENDS</tspan></text><text x="300" y="400" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="300" dy="0">A race on one seed, ranked</tspan><tspan x="300" dy="18">by time (race.js)</tspan></text><rect x="552" y="16" width="252" height="466" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="552" y="16" width="252" height="54" rx="8" fill="#A85D00"  /><rect x="552" y="50" width="252" height="20" rx="0" fill="#A85D00"  /><text x="568" y="49" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="568" dy="0">Arcade</tspan></text><text x="788" y="49" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end"  ><tspan x="788" dy="0">9 games</tspan></text><text x="568" y="92" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="568" dy="0">CONTRACT</tspan></text><text x="568" y="110" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">loop.js — a canvas and</tspan><tspan x="568" dy="18">a fixed-timestep loop</tspan></text><text x="568" y="160" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="568" dy="0">HARNESS</tspan></text><text x="568" y="178" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">loophost.js, for all but</tspan><tspan x="568" dy="18">Tetris, which draws its own</tspan></text><text x="568" y="228" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="568" dy="0">THE RULE</tspan></text><text x="568" y="246" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">60 Hz fixed timestep, input on</tspan><tspan x="568" dy="18">tick boundaries: a run replays</tspan><tspan x="568" dy="18">from its seed</tspan></text><text x="568" y="314" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="568" dy="0">GAMES</tspan></text><text x="568" y="332" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">Tetris · Snake · Worm Arena</tspan><tspan x="568" dy="18">Tower Defense · Crowd Rush</tspan><tspan x="568" dy="18">Strike Squad · Blend In</tspan><tspan x="568" dy="18">Stick Clash · Street Chef</tspan></text><text x="568" y="418" font-size="11.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="568" dy="0">WITH FRIENDS</tspan></text><text x="568" y="436" font-size="13.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">A race on one seed, ranked</tspan><tspan x="568" dy="18">by score (race.js)</tspan></text><rect x="16" y="496" width="788" height="58" rx="8" fill="#FFF6DD" stroke="#F6B32B" stroke-width="1.5" /><text x="32" y="520" font-size="14.5" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="32" dy="0">A new game changes no screen: it lives in js/games/&lt;code&gt;/, and outside it is only listed.</tspan></text><text x="32" y="540" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="32" dy="0">Its index.js calls PV.Registry.add(); the lobby, statistics, option sheet and save format follow.</tspan></text>
</svg>