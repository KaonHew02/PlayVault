<meta name="referrer" content="no-referrer">
<!-- The page's own limits. Everything this app runs is its own file, with two
     exceptions named here: the PeerJS broker client, pinned by hash below,
     and Google's sign-in script for the Drive copy, which drive.js fetches
     only when Drive is used — Google serves it unversioned, so it cannot be
     pinned, and SECURITY.md says what that means. The Drive calls themselves
     go to www.googleapis.com. That library also tries to add an inline
     stylesheet for Google's own sign-in button, which PlayVault never shows;
     `style-src` refuses it on purpose, so one console error when Drive loads
     is expected and harmless. No inline script, no eval, nowhere to post a
     form to, and nothing loadable as a plugin. `frame-ancestors` is
     deliberately absent: browsers ignore it in a meta tag, and a static host
     cannot send headers, so that one is honestly out of reach rather than
     quietly listed. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdnjs.cloudflare.com https://accounts.google.com/gsi/client;
  style-src 'self';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://www.googleapis.com https://accounts.google.com/gsi/;
  frame-src https://accounts.google.com/gsi/;
  media-src 'none';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<link rel="icon" href="assets/logo/favicon.svg">
<link rel="apple-touch-icon" href="assets/logo/icon.svg">

<!-- PeerJS, for playing with friends and nothing else. Loaded async: if it never
     arrives, PV.Net.available() is false, the friends screen says so, and every
     other part of PlayVault carries on working offline.

     PINNED BY HASH. This is the only third-party code in the app, and without
     `integrity` a bad day at the CDN is arbitrary code running on this page
     with full access to every save in it. If the file ever fails to match,
     the browser refuses to run it and playing with friends stops working —
     which is the correct outcome, and the reason the rest of the app is
     built to carry on without it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
        integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
        crossorigin="anonymous" referrerpolicy="no-referrer" async defer></script>
