<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" width="820" height="486" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566579"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
</defs>
<rect width="820" height="486" fill="#FFFFFF"/>
<rect x="16" y="12" width="788" height="164" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="12" width="210" height="164" rx="8" fill="#171D26"  /><rect x="200" y="12" width="26" height="164" rx="0" fill="#171D26"  /><text x="34" y="46" font-size="30" font-weight="700" fill="#F6B32B" text-anchor="start"  ><tspan x="34" dy="0">1</tspan></text><text x="34" y="72" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="34" dy="0">The lock</tspan></text><text x="34" y="92" font-size="12" font-weight="400" fill="#D5DBE4" text-anchor="start"  ><tspan x="34" dy="0">guard.js, first in the head</tspan></text><text x="244" y="32" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="244" dy="0">A FRIEND TRIES</tspan></text><text x="566" y="32" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="566" dy="0">AND GETS</tspan></text><text x="244" y="56" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">PV.Profile.addXp(…) pasted in the console</tspan></text><text x="534" y="56" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="56" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">PV is undefined</tspan></text><line x1="244" y1="65" x2="790" y2="65" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="82" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">localStorage, textContent, .click(), .style …</tspan></text><text x="534" y="82" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="82" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Refused: “PlayVault is locked”</tspan></text><line x1="244" y1="91" x2="790" y2="91" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="108" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">Math.random, JSON.stringify or WebGL replaced</tspan></text><text x="534" y="108" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="108" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Frozen — cannot be replaced</tspan></text><line x1="244" y1="117" x2="790" y2="117" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="134" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">Elements panel: a number typed over</tspan></text><text x="534" y="134" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="134" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Put back at once, and logged</tspan></text><line x1="244" y1="143" x2="790" y2="143" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="160" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">F12, Ctrl+Shift+I, right-click</tspan></text><text x="534" y="160" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="160" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Nothing — a speed bump only</tspan></text><rect x="16" y="186" width="788" height="112" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="186" width="210" height="112" rx="8" fill="#2A3441"  /><rect x="200" y="186" width="26" height="112" rx="0" fill="#2A3441"  /><text x="34" y="220" font-size="30" font-weight="700" fill="#F6B32B" text-anchor="start"  ><tspan x="34" dy="0">2</tspan></text><text x="34" y="246" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="34" dy="0">Seals</tspan></text><text x="34" y="266" font-size="12" font-weight="400" fill="#D5DBE4" text-anchor="start"  ><tspan x="34" dy="0">on every record and every backup</tspan></text><text x="244" y="206" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="244" dy="0">A FRIEND TRIES</tspan></text><text x="566" y="206" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="566" dy="0">AND GETS</tspan></text><text x="244" y="230" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">Edit coins in an export, then Import</tspan></text><text x="534" y="230" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="230" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Refused: the seal does not match</tspan></text><line x1="244" y1="239" x2="790" y2="239" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="256" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">Edit a value in the Application tab</tspan></text><text x="534" y="256" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="256" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Dropped on the next read</tspan></text><line x1="244" y1="265" x2="790" y2="265" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="282" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">The same edit, on the copy in Drive</tspan></text><text x="534" y="282" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="282" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Refused before it is summarised</tspan></text><rect x="16" y="308" width="788" height="112" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="308" width="210" height="112" rx="8" fill="#5B6B80"  /><rect x="200" y="308" width="26" height="112" rx="0" fill="#5B6B80"  /><text x="34" y="342" font-size="30" font-weight="700" fill="#F6B32B" text-anchor="start"  ><tspan x="34" dy="0">3</tspan></text><text x="34" y="368" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="34" dy="0">Rebuild, never adopt</tspan></text><text x="34" y="388" font-size="12" font-weight="400" fill="#D5DBE4" text-anchor="start"  ><tspan x="34" dy="0">js/core/safe.js</tspan></text><text x="244" y="328" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="244" dy="0">A FRIEND TRIES</tspan></text><text x="566" y="328" font-size="10.5" font-weight="700" fill="#566579" text-anchor="start"  letter-spacing="0.8"><tspan x="566" dy="0">AND GETS</tspan></text><text x="244" y="352" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">A stored record, from any tool</tspan></text><text x="534" y="352" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="352" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Validated and clamped on every read</tspan></text><line x1="244" y1="361" x2="790" y2="361" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="378" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">A backup or Drive file</tspan></text><text x="534" y="378" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="378" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Rebuilt field by field; 4 MB cap</tspan></text><line x1="244" y1="387" x2="790" y2="387" stroke="#EEF1F5" stroke-width="1"/><text x="244" y="404" font-size="13" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="244" dy="0">A message from a peer in a room</tspan></text><text x="534" y="404" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="534" dy="0">→</tspan></text><text x="566" y="404" font-size="13" font-weight="600" fill="#171D26" text-anchor="start"  ><tspan x="566" dy="0">Fields capped; the host decides</tspan></text><rect x="16" y="430" width="788" height="44" rx="8" fill="#FFF6DD" stroke="#F6B32B" stroke-width="1.5" /><text x="410" y="449" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="middle"  ><tspan x="410" dy="0">Around all of it: Content-Security-Policy (no inline script, no eval) · SRI on PeerJS · no-referrer</tspan></text><text x="410" y="466" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="middle"  ><tspan x="410" dy="0">and the page is a picture, never the source of truth — no button trusts its own “disabled”</tspan></text>
</svg>