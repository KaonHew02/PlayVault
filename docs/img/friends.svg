<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 528" width="820" height="528" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566579"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
</defs>
<rect width="820" height="528" fill="#FFFFFF"/>
<rect x="16" y="12" width="788" height="40" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="410" y="37" font-size="13.5" font-weight="600" fill="#171D26" text-anchor="middle"  ><tspan x="410" dy="0">PeerJS broker: introductions only. After that, everything goes browser to browser — no server holds the game.</tspan></text><rect x="16" y="66" width="788" height="216" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="66" width="788" height="34" rx="8" fill="#2F5E96"  /><rect x="16" y="86" width="788" height="14" rx="0" fill="#2F5E96"  /><text x="32" y="89" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="32" dy="0">Board games — host authority</tspan></text><rect x="32" y="118" width="232" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="44" y="142" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="44" dy="0">Guest</tspan></text><text x="44" y="163" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="44" dy="0">asks: “move #n”</tspan><tspan x="44" dy="17">never applied locally</tspan></text><line x1="267" y1="164" x2="291" y2="164" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="294" y="118" width="232" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="306" y="142" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="306" dy="0">Host</tspan></text><text x="306" y="163" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="306" dy="0">apply() checks</tspan><tspan x="306" dy="17">legalMoves(): accepts</tspan><tspan x="306" dy="17">or refuses</tspan></text><line x1="529" y1="164" x2="553" y2="164" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="556" y="118" width="232" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="568" y="142" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="568" dy="0">Everyone, host too</tspan></text><text x="568" y="163" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="568" dy="0">post(accepted move,</tspan><tspan x="568" dy="17">its index) — one path</tspan><tspan x="568" dy="17">into every board</tspan></text><text x="32" y="236" font-size="12.5" font-weight="400" fill="#566579" text-anchor="start"  ><tspan x="32" dy="0">A seat is taken from the connection, never from the message. The index is the whole resync protocol:</tspan><tspan x="32" dy="18">below our history we have it, equal we apply it, above we ask for the list and rebuild.</tspan></text><rect x="16" y="296" width="788" height="216" rx="8" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1.5" /><rect x="16" y="296" width="788" height="34" rx="8" fill="#A85D00"  /><rect x="16" y="316" width="788" height="14" rx="0" fill="#A85D00"  /><text x="32" y="319" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"  ><tspan x="32" dy="0">Puzzle and arcade — one shared seed</tspan></text><rect x="32" y="348" width="166" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="44" y="372" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="44" dy="0">Host</tspan></text><text x="44" y="393" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="44" dy="0">picks the game,</tspan><tspan x="44" dy="17">options and seed</tspan></text><line x1="201" y1="394" x2="225" y2="394" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="228" y="348" width="166" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="240" y="372" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="240" dy="0">Every player</tspan></text><text x="240" y="393" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="240" dy="0">runs their own copy</tspan><tspan x="240" dy="17">from the same seed</tspan></text><line x1="397" y1="394" x2="421" y2="394" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="424" y="348" width="166" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="436" y="372" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="436" dy="0">Progress line</tspan></text><text x="436" y="393" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="436" dy="0">about once a second,</tspan><tspan x="436" dy="17">and a finishing line</tspan></text><line x1="593" y1="394" x2="617" y2="394" stroke="#566579" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="620" y="348" width="166" height="92" rx="8" fill="#EEF1F5" stroke="#C9D1DC" stroke-width="1.5" /><text x="632" y="372" font-size="14.5" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="632" dy="0">Host ranks</tspan></text><text x="632" y="393" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="632" dy="0">one table, the same</tspan><tspan x="632" dy="17">on every screen</tspan></text><text x="32" y="466" font-size="12.5" font-weight="400" fill="#566579" text-anchor="start"  ><tspan x="32" dy="0">Sixty frames a second over a public broker does not hold up; a seed does. A called race is settled on the score at that moment.</tspan><tspan x="32" dy="18">A patched client can still claim a score — inherent to peer-to-peer play without an authority, and written down in SECURITY.md.</tspan></text>
</svg>