<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayVault — One Hub. Endless Games.</title>
<meta name="description" content="PlayVault — one hub, endless games. Board, puzzle and arcade games that run entirely in your browser.">
<meta name="theme-color" content="#0B0F14">
<meta name="referrer" content="no-referrer">
<!-- The page's own limits. Everything this app runs is its own file; the one
     exception is the PeerJS broker client, which is named here and pinned by
     hash below. No inline script, no eval, nowhere to post a form to, and
     nothing loadable as a plugin. `frame-ancestors` is deliberately absent:
     browsers ignore it in a meta tag, and a static host cannot send headers,
     so that one is honestly out of reach rather than quietly listed. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdnjs.cloudflare.com;
  style-src 'self';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self' https://0.peerjs.com wss://0.peerjs.com;
  media-src 'none';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<link rel="icon" href="assets/logo/favicon.svg">
<link rel="apple-touch-icon" href="assets/logo/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/games">
    <img src="assets/logo/logo-simple.svg" alt="" width="36" height="36" decoding="async">
    <span class="brand-text">
      <span class="brand-name">Play<b>Vault</b></span>
      <span class="brand-slogan" data-i18n="app.tagline"></span>
    </span>
  </a>
  <nav class="nav">
    <a href="#/games" data-nav="games" data-i18n="nav.lobby"></a>
    <a href="#/stats" data-nav="stats" data-i18n="nav.stats"></a>
    <a href="#/settings" data-nav="settings" data-i18n="nav.settings"></a>
  </nav>
</header>

<main id="app"></main>

<noscript><p class="noscript">PlayVault needs JavaScript.</p></noscript>

<!-- PeerJS, for playing with friends and nothing else. Loaded async: if it never
     arrives, PV.Net.available() is false, the friends screen says so, and every
     other part of PlayVault carries on working offline.

     PINNED BY HASH. This is the only third-party code in the app, and without
     `integrity` a bad day at the CDN is arbitrary code running on this page
     with full access to every save in it. If the file ever fails to match,
     the browser refuses to run it and playing with friends stops working —
     which is the correct outcome, and the reason the rest of the app is
     built to carry on without it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
        integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
        crossorigin="anonymous" referrerpolicy="no-referrer" async defer></script>

<!-- THE DEVELOPMENT PAGE. It loads every source file separately, which is
     what you want while working: real filenames in the debugger, real line
     numbers in a stack trace, and no build step between an edit and a reload.
     Serve it as /index.dev.html.

     `node tools/build.js` reads THIS file for the list and the order, and
     writes the deployed index.html from it. Change a script tag here, never
     there. -->
