y · Strike Squad (first-person shooter) · Blend In (paint to</tspan><tspan x="318" dy="16">hide)</tspan></text><line x1="16" y1="355" x2="804" y2="355" stroke="#EEF1F5"/><text x="16" y="385" font-size="14" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">28 Sep</tspan></text><rect x="78" y="366" width="176" height="26" rx="5" fill="#F6B32B"  /><text x="262" y="385" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="262" dy="0">8</tspan></text><text x="318" y="376" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="318" dy="0">Bot difficulty measured and eased · Stick Clash · Street Chef, 680 levels ·</tspan><tspan x="318" dy="16">full screen on every game</tspan></text><line x1="16" y1="401" x2="804" y2="401" stroke="#EEF1F5"/><text x="16" y="431" font-size="14" font-weight="700" fill="#171D26" text-anchor="start"  ><tspan x="16" dy="0">29 Sep</tspan></text><rect x="78" y="412" width="88" height="26" rx="5" fill="#F6B32B"  /><text x="174" y="431" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="start"  ><tspan x="174" dy="0">4</tspan></text><text x="318" y="422" font-size="12.5" font-weight="400" fill="#26303D" text-anchor="start"  ><tspan x="318" dy="0">The lock · the project proposal · a save that cannot be written says so ·</tspan><tspan x="318" dy="16">the docs corrected</tspan></text><line x1="16" y1="447" x2="804" y2="447" stroke="#EEF1F5"/>
